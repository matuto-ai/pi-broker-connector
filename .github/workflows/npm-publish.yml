name: Publish npm package
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PI_TEST_EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require release tag matching package version
        run: node -e 'const p=require("./package.json"); if(process.env.RELEASE_TAG!==`v${p.version}`) throw Error("Release tag must match package version");'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run check
      - name: Build release once and test the shipped package
        run: |
          npm test -- --output .artifacts
          echo "PI_TEST_ARTIFACT=$(realpath .artifacts/*.tgz)" >> "$GITHUB_ENV"
      - run: npm install --prefix "$RUNNER_TEMP/pi-host" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.4.0
      - run: npm run test:host
        env:
          PI_TEST_INSTALL: ${{ runner.temp }}/pi-host
      - name: Publish the exact tested tarball without rebuilding
        run: npm publish "$PI_TEST_ARTIFACT" --ignore-scripts --access public --provenance
      - name: Preserve tested release artifact and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-release-package-${{ github.sha }}
          path: .artifacts/*
          if-no-files-found: warn
          include-hidden-files: true
